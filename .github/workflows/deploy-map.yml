name: Deploy map

# Publishes map/ to GitHub Pages whenever the map changes, so code changes go
# live without waiting for the daily town update (which also deploys).
on:
  push:
    paths:
      - "map/**"
      - ".github/workflows/deploy-map.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: map
      - id: deploy
        uses: actions/deploy-pages@v5

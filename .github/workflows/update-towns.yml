name: Update EarthMC towns

on:
  schedule:
    - cron: "17 6 * * *"   # daily, 06:17 UTC
  workflow_dispatch:
    inputs:
      days_per_cycle:
        description: "Refresh every town once per N runs (1 = full scan)"
        required: false
        default: "7"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update-towns
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      # Check out the branch tip, not the run's original commit, so re-runs of old runs still push cleanly
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref }}

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Fetch today's slice of towns
        env:
          DAYS_PER_CYCLE: ${{ inputs.days_per_cycle || '7' }}
        run: python3 earthmc_towns.py

      - name: Rebuild map data
        run: python3 make_map.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data map
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Update towns: cycle $(jq .cycle data/state.json), $(jq .last_run_fetched data/state.json) fetched"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push

      - name: Publish map to GitHub Pages
        uses: actions/upload-pages-artifact@v4
        with:
          path: map

      - id: deploy
        uses: actions/deploy-pages@v5
